<div class="container container--supervisor home-supervisor">

    <div class="wrapper">
        <div class="dashboard-body">

            <div class="supervisor-card">
                <div class="profile-container">
                    <div class="profile-image-frame">
                        <span class="ri-user-3-fill"></span>
                    </div>
                    <div class="profile-details">
                        <h1>Panel Supervisor</h1>
                        <h3>Bienvenido</h3>
                        <p><span class="ri-map-pin-line"></span> Santander · Supervisor activo</p>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <img src="asset/ilustracion_voluntarios.svg" alt="" aria-hidden="true" class="dashboard-grid__ilustracion">

                <div class="stats-panel">

                    <div class="stat-planes__familiares">

                        <h3 class="section-headline">Estado planes familiares</h3>
    
                        <div class="grid-cuadrícula">
                            <div class="card-conteo aprobados">
                                <span class="ri-checkbox-circle-line icon-size"></span>
                                <div class="info">
                                    <h5>Planes Aprobados</h5>
                                    <div class="number" id="planesAprobados">0</div>
                                    
                                </div>
                            </div>
                            <div class="card-conteo rechazados">
                                <span class="ri-close-circle-line icon-size"></span>
                                <div class="info">
                                    <h5>Planes Rechazados</h5>
                                    <div class="number" id="planesRechazados">0</div>
                                    
                                </div>
                            </div>
                            <div class="card-conteo pendientes">
                                <span class="ri-time-line icon-size"></span>
                                <div class="info">
                                    <h5>Planes Pendientes</h5>
                                    <div class="number" id="planesEnRevision">0</div>
                                    
                                </div>
                            </div>
                            <div class="card-conteo nuevos">
                                <span class="ri-file-2-line icon-size"></span>
                                <div class="info">
                                    <h5>Planes Recibidos</h5>
                                    <div class="number" id="planesRecibidos">0</div>
                                    
                                </div>
                            </div>
                        </div>
    
                        <div class="total-revisados-container">
                            <h4><span class="ri-hotel-line"></span> Total planes revisados</h4>
                            <div class="big-display" id="totalRevisados">0</div>
                        </div>
                    </div>

                    <div class="bottom-split-cards">
                        <div class="mini-metric-card">
                            <div class="mini-card-lbl">
                                <span class="ri-team-line"></span> Voluntarios activos
                            </div>
                            <div class="big-val" id="voluntariosActivos">0</div>
                        </div>
                        <div class="mini-metric-card">
                            <div class="mini-card-lbl">
                                <span class="ri-file-list-3-line"></span> Promedio planes por Voluntario
                            </div>
                            <div class="big-val" id="promedioPlanes">0%</div>
                        </div>
                    </div>

                    <button class="btn-action-orange" id="btnEstadisticas">
                        <span class="ri-bar-chart-box-line"></span> Ver estadísticas
                    </button>
                </div>

                <div class="planes-container-panel">
                    <div class="panel-planes-title">
                        Planes Familiares
                        <span class="ri-team-line"></span>
                    </div>

                    <div class="planes-lista" id="planesList"></div>

                    <div class="planes-panel-footer">
                        <button class="btn-action-orange" id="btnVerTodos">
                            <span class="ri-eye-line"></span> Ver todos los planes
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>
